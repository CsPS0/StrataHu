services:
  postgres:
    image: postgres:17-alpine
    container_name: stratahu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stratahu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stratahu_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-stratahu}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stratahu} -d ${POSTGRES_DB:-stratahu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stratahu-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-stratahu};Username=${POSTGRES_USER:-stratahu};Password=${POSTGRES_PASSWORD:-stratahu_local_dev}"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}

volumes:
  postgres_data:
